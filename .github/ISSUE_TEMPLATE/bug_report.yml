name: Bug report
description: Report a reproducible problem in PURPLE RUSH
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Remove personal paths or account names from logs before attaching them.
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the header, e.g. 4.0
      placeholder: "4.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Run `winver` or `Get-ComputerInfo | Select WindowsProductName, WindowsVersion, OsBuildNumber`
      placeholder: "Windows 11 24H2, build 26100"
    validations:
      required: true
  - type: dropdown
    id: admin
    attributes:
      label: Running as administrator?
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the exact error text.
    validations:
      required: true
  - type: textarea
    id: selftest
    attributes:
      label: Self-test output
      description: Run `powershell -NoProfile -ExecutionPolicy Bypass -File .\src\RustOptimizer.ps1 -SelfTest`
      render: text
  - type: textarea
    id: log
    attributes:
      label: Relevant log lines
      description: From `%ProgramData%\RustOptimizer\rust-optimizer.log`
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I rebuilt the source with `rebuild-bat.ps1` before testing.
          required: true
        - label: I removed personal information from logs.
          required: true
