name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_DIR: build
  CONFIG: Release

jobs:
  windows:
    name: Windows x64 (MSVC, /W4)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake + MSVC)
        run: >
          cmake -S . -B $env:BUILD_DIR -A x64
          -DRO_BUILD_TESTS=ON -DRO_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build $env:BUILD_DIR --config $env:CONFIG --parallel

      - name: Unit tests
        run: ctest --test-dir $env:BUILD_DIR -C $env:CONFIG --output-on-failure

      - name: Self-test (smoke)
        run: |
          $exe = Join-Path $env:BUILD_DIR "$env:CONFIG\RustOptimizer.exe"
          if (-not (Test-Path $exe)) { throw "Executable not found: $exe" }
          & $exe --version
          & $exe --selftest

      - name: Package
        shell: pwsh
        run: |
          $exe = Join-Path $env:BUILD_DIR "$env:CONFIG\RustOptimizer.exe"
          $stage = Join-Path $env:RUNNER_TEMP "RustOptimizer"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe $stage
          Copy-Item README.md, LICENSE $stage
          $zip = Join-Path $env:RUNNER_TEMP "RustOptimizer-win64.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$hash  RustOptimizer-win64.zip" | Set-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP "SHA256SUMS.txt")
          "SIZE=$((Get-Item $zip).Length)"          | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "ZIP=$zip"                                | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "EXE=$exe"                                | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build installer (NSIS)
        shell: pwsh
        run: |
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            Write-Host "NSIS not found, installing via Chocolatey"
            choco install nsis -y --no-progress
          }
          if (-not (Test-Path $makensis)) { throw "makensis.exe not found" }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'VERSION\s+(\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          $exe = Join-Path $env:BUILD_DIR "$env:CONFIG\RustOptimizer.exe"
          $setup = Join-Path $env:RUNNER_TEMP "RustOptimizer-Setup-$version.exe"
          & $makensis /V2 /INPUTCHARSET UTF8 /DAPP_VERSION=$version "/DAPP_EXE=$exe" "/DOUT_EXE=$setup" installer\RustOptimizer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with $LASTEXITCODE" }
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLower()
          "$hash  RustOptimizer-Setup-$version.exe" | Out-File -Append -Encoding ascii (Join-Path $env:RUNNER_TEMP "SHA256SUMS.txt")
          "SETUP=$setup" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustOptimizer-win64
          path: |
            ${{ env.ZIP }}
            ${{ env.EXE }}
            ${{ env.SETUP }}
            ${{ runner.temp }}/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Rust Optimizer ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ env.ZIP }}
            ${{ env.EXE }}
            ${{ env.SETUP }}
            ${{ runner.temp }}/SHA256SUMS.txt
